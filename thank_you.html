          var toggleDropdown = document.querySelector(".toggle-dropdown");

          var navLinks = document.querySelectorAll(".largeDropdown a");

          function toggleNavMenu() {
              if (dropdown.style.display === "block") {
                  dropdown.style.display = "none";
              } else {
                  dropdown.style.display = "block";
              }
          }

          function closeDropdown() {
              dropdown.style.display = "none";
          }

          productServices.addEventListener("click", function (event) {
              event.preventDefault();
              event.stopPropagation();
              toggleNavMenu();
          });

          navLinks.forEach(link => {
              link.addEventListener("click", function () {
                  closeDropdown();
              });
          });

          document.addEventListener("click", function (event) {
              if (!dropdown.contains(event.target) && !productServices.contains(event.target)) {
                  closeDropdown();
              }
          });
      });

          function searchBlogs() {
              let input = document.getElementById("blogSearch").value.toLowerCase();
              let blogs = document.querySelectorAll(".blog-data");

              blogs.forEach(function (blog) {
                  let title = blog.querySelector("h4").innerText.toLowerCase();
                  let desc = blog.querySelector("p").innerText.toLowerCase();

                  if (title.includes(input) || desc.includes(input)) {

                  } else {
                      blog.parentElement.style.display = "none"; // hide
                  }
              });

          function searchBlogs() {
              let input = document.getElementById("blogSearch").value.toLowerCase();
              let blogs = document.querySelectorAll(".blog-data");
              let found = false;
